<head>

<style>
    *{
        padding:0;
        margin:0;
        box-sizing: border-box;
    }
    body{
        background-image:url("/contact.webp");
        background-size: cover;
    }
 nav{
        color:white;
        /* background-color: black; */
        display:flex;
        justify-content: space-evenly;
        align-items:center;
        height:60px;

    }
    li{
    list-style:none;
    padding:23px;
    display:inline;
    font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
    color:white;
    }
    .icon{
        margin-right:auto;
        font-size:24px;
        font-weight:bold;
        font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
    }
    a{
            text-decoration:none;
            color:white;
            
        }
        li a:hover{
            text-decoration:underline;
        }

    .main-form{
        display:block;
        margin:auto;
        margin-top:70px;
        align-items:center;
        justify-content:center;
        /* background-color: blue; */
        height:350px;
        width:25%;
       /* box-shadow: 5px 5px 5px white; */
       border:1px solid white;
       border-radius:10px;
       
    }
    .material{
        display:flex;
        flex-wrap:wrap;
        padding:40px;
        margin:auto;
        
    }
    label{
        /* padding:12px; */
        margin:7px;
      font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
      color:white;
    }
    input{
        /* padding:12px; */
        margin:2px;
        padding:1px 24px;
         font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
         text-align:left;
         border-radius:7px;
         font-size:11px;

    }
    .btn{
        display:flex;
        justify-content: center;
        align-items:center;
       padding:5px;
       padding-top:25px;
       margin:auto;

    }
    .form-btn{
        padding:7px;
        background-color: rgb(79, 117, 150);
        border-radius:10px;
    }
    .form-btn:hover{
        color:rgb(6, 53, 94);
        background-color: white;
    }

    
        .footer{
            display:flex;
            justify-content: center;
            align-items:center;
            margin-top:30px;
            /* background-color: black; */
            color:white;
            height:40px;
            border:none;
            font-weight: bold;
            
        }

</style>
<body>
<div>
        <nav>
            <li class="icon">Innovative Solution</li>
            <li>
               <a href="/Project.html" target="_blank">Home</a>
            </li>
            <li>
                <a href="/About.html" target="_blank">About Us</a>
            </li>
            <li>
                <a href="#">Blog</a>
            </li>
            <li>
                <a href="/contact.html" target="_blank">Contact Us</a>
            </li>
        </nav>
    </div>

    <div class="main-form">
        <div class="material">
            <label for="name">Enter Name</label>
        <input type="text" name="name" placeholder="John Harry">
          <label for="email">Enter Email</label>
        <input type="email" placeholder="abc@gmail.com" name="email">
        <label for="password">Enter Password</label>
        <input type="password" name="password" placeholder="8-digit code">
        <div class="btn">
            <button class="form-btn">
                Submit
            </button>
        </div>

        </div>
    </div>

    <div class="footer">
